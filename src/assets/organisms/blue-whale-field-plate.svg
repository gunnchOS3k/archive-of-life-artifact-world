<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">Blue whale — original field-study illustration</title>
  <desc id="description">Balaenoptera musculus, a long, tapered baleen whale with a broad head, mottled blue-gray skin, a small dorsal fin far back on the body, narrow flippers and broad tail flukes. Lateral view with a slight view of the back. Stylized educational artwork; not a measured specimen or taxonomic identification key.</desc>
  <metadata>Original editable SVG authored for gunnchOS3k Archive of Life, November 1, 2026. Anatomical reading references: NOAA Fisheries Blue Whale; Fisheries and Oceans Canada northwest Atlantic recovery strategy section 1.2. No source image traced or embedded. Production candidate; independent art review and human acceptance pending.</metadata>
